identity:
  name: retry
  author: vuji
  label:
    en_US: Retry Tool
    zh_Hans: 重试工具
description:
  human:
    en_US: Wrap an operation with exponential backoff retry
    zh_Hans: 给操作封装指数退避重试
  llm: Use this tool when a call needs retry with exponential backoff.
parameters:
  - name: operation
    type: string
    required: true
    label:
      en_US: Operation
      zh_Hans: 操作类型
    human_description:
      en_US: What operation to retry (llm_call / http_call / db_query)
      zh_Hans: 要重试的操作类型
    llm_description: The operation to execute with retry support.
    form: llm
  - name: max_retries
    type: number
    required: false
    default: 3
    label:
      en_US: Max Retries
      zh_Hans: 最大重试次数
    human_description:
      en_US: Maximum retry attempts for transient errors
      zh_Hans: 瞬时错误的最大重试次数
    form: form
  - name: simulate_failures
    type: number
    required: false
    default: 0
    label:
      en_US: Simulated Failures
      zh_Hans: 模拟失败次数
    human_description:
      en_US: Fail the first N calls (for testing)
      zh_Hans: 前 N 次模拟失败（测试用）
    form: form
